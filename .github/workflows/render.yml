name: Render ICQ ad

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tools/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/render.yml"
      - "*.jpg"
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out video project
        uses: actions/checkout@v4

      - name: Check out private ICQ smile source (read-only)
        uses: actions/checkout@v4
        with:
          repository: barlok719-cmyk/tiktok-rv-private
          ref: ultramod/next
          token: ${{ secrets.ICQ_REPO_TOKEN }}
          path: icq-source

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil

      - name: Prepare anonymized phone recording with original animated ICQ smiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets public out
          LOGO_FILE="$(find . -maxdepth 1 -type f -iname '*.jpg' -print -quit)"
          test -n "$LOGO_FILE"
          cp "$LOGO_FILE" assets/logo.jpg
          cp assets/logo.jpg public/logo.jpg
          python tools/prepare_source.py
          python tools/prepare_smiles.py --zip icq-source/my-folder/Animated.zip --ini icq-source/my-folder/_define.ini --out public/smiles
          ffmpeg -y -i "21338455214597.mp4" \
            -i assets/avatar-small.png -i assets/avatar-large.png \
            -stream_loop -1 -i public/smiles/01-yahoo.gif \
            -stream_loop -1 -i public/smiles/02-dance.gif \
            -stream_loop -1 -i public/smiles/03-rofl.gif \
            -stream_loop -1 -i public/smiles/04-in-love.gif \
            -stream_loop -1 -i public/smiles/05-wink.gif \
            -stream_loop -1 -i public/smiles/06-thumbs-up.gif \
            -stream_loop -1 -i public/smiles/07-bye.gif \
            -filter_complex "[0:v]drawbox=x=62:y=68:w=58:h=58:color=black:t=fill,drawbox=x=205:y=165:w=205:h=205:color=black:t=fill,drawbox=x=116:y=84:w=130:h=31:color=black:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='ICQ User':fontcolor=white:fontsize=18:x=120:y=90,drawbox=x=220:y=344:w=136:h=31:color=black:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='ICQ User':fontcolor=white:fontsize=19:x=228:y=350[v0];[v0][1:v]overlay=x=69:y=75[v1];[v1][2:v]overlay=x=239:y=199[v2];[3:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s1];[v2][s1]overlay=x=390:y=575:enable='between(t,1.3,2.6)'[v3];[4:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s2];[v3][s2]overlay=x=380:y=690:enable='between(t,2.7,4.0)'[v4];[5:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s3];[v4][s3]overlay=x=385:y=805:enable='between(t,4.1,5.4)'[v5];[6:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s4];[v5][s4]overlay=x=365:y=585:enable='between(t,5.5,6.8)'[v6];[7:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s5];[v6][s5]overlay=x=385:y=700:enable='between(t,6.9,8.2)'[v7];[8:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s6];[v7][s6]overlay=x=380:y=810:enable='between(t,8.3,9.6)'[v8];[9:v]scale=104:104:force_original_aspect_ratio=decrease,format=rgba[s7];[v8][s7]overlay=x=385:y=640:enable='between(t,9.7,11.0)',drawbox=x=0:y=900:w=576:h=270:color=black:t=fill:enable='between(t,8.5,10.7)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='ICQ SMILES':fontcolor=0x00E6D5:fontsize=38:x=(w-text_w)/2:y=980:enable='between(t,8.5,10.7)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='STICKERS AND ANIMATION':fontcolor=white:fontsize=20:x=(w-text_w)/2:y=1040:enable='between(t,8.5,10.7)'[vout]" \
            -map "[vout]" -map 0:a? -c:v libx264 -preset veryfast -crf 18 \
            -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart \
            out/icq-source-redacted.mp4
          cp out/icq-source-redacted.mp4 public/icq-source-redacted.mp4
          ffmpeg -y -f lavfi -i "sine=frequency=110:duration=18" -f lavfi -i "sine=frequency=220:duration=18" -f lavfi -i "sine=frequency=440:duration=18" \
            -filter_complex "[0:a]volume=0.12,afade=t=in:st=0:d=1,afade=t=out:st=17:d=1[a0];[1:a]volume=0.045,tremolo=f=2.5:d=0.35[a1];[2:a]volume=0.018,tremolo=f=5:d=0.4[a2];[a0][a1][a2]amix=inputs=3:normalize=0,alimiter=limit=0.9[out]" \
            -map "[out]" -c:a pcm_s16le public/neon-bed.wav

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare Remotion browser
        run: npx remotion browser ensure

      - name: Render vertical MP4
        run: npx remotion render src/index.ts ICQAd out/ICQ-Ultra-Mod-ad.mp4 --codec=h264

      - name: Verify audio and video streams
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 out/ICQ-Ultra-Mod-ad.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: icq-ultra-mod-ad
          path: out/ICQ-Ultra-Mod-ad.mp4
          if-no-files-found: error
          retention-days: 14
