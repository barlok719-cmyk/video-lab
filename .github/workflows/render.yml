name: Render video

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npx remotion render src/index.ts Laboratory42 out/lab-test.mp4 --codec=h264

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-42-video
          path: out/lab-test.mp4
          if-no-files-found: error
          retention-days: 7
